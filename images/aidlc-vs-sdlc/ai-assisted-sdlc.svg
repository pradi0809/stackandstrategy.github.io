<rect x="32" y="262" width="3" height="60" fill="#315f91"/>
<text x="50" y="286" font-family="'DM Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="500" fill="#315f91" text-anchor="start" letter-spacing="1.2">HUMAN-COORDINATED</text>
<text x="50" y="308" font-family="Manrope, 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#354151" text-anchor="start">A developer still gathers context, prompts the assistant, reviews, corrects, tests and commits.</text>
<rect x="32.5" y="342.5" width="357" height="69" rx="0" fill="#ffffff" stroke="#d5dce5" stroke-width="1"/>
<text x="50" y="366" font-family="'DM Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="500" fill="#2f7d5b" text-anchor="start" letter-spacing="1.2">WHAT IMPROVES</text>
<text x="50" y="392" font-family="Manrope, 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#17202c" text-anchor="start">The speed of individual tasks</text>
<rect x="410.5" y="342.5" width="357" height="69" rx="0" fill="#ffffff" stroke="#d5dce5" stroke-width="1"/>
<text x="428" y="366" font-family="'DM Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="500" fill="#8a94a1" text-anchor="start" letter-spacing="1.2">WHAT STAYS THE SAME</text>
<text x="428" y="392" font-family="Manrope, 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#17202c" text-anchor="start">The workflow, handoffs and coordination</text>
<text x="400" y="448" font-family="Manrope, 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#687383" text-anchor="middle" font-style="italic">A more capable tool inside an existing process: valuable, but a transitional phase.</text>
