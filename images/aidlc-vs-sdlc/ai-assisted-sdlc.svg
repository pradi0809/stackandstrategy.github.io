<text x="702" y="195" font-family="Manrope, 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#172b42" text-anchor="middle">AI drafts docs</text>
<text x="702" y="211" font-family="Manrope, 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#172b42" text-anchor="middle">and scripts</text>
<line x1="702" y1="226" x2="702" y2="262" stroke="#8a94a1" stroke-width="1"/>
