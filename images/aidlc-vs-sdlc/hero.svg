<text x="844" y="342" font-family="Manrope, 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#17202c" text-anchor="start">Orchestrated workflow</text>
