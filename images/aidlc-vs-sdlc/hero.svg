<text x="60" y="156" font-family="Manrope, 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="#ffffff" text-anchor="start" letter-spacing="-1.5">AI-DLC vs SDLC</text>
<text x="60" y="204" font-family="Manrope, 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#c0cbd7" text-anchor="start">From writing code faster to rethinking how we build software.</text>
<rect x="60.5" y="268.5" width="319" height="221" rx="0" fill="#22394f" stroke="#2f4b67" stroke-width="1"/>
<text x="84" y="306" font-family="'DM Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#9bb8d4" text-anchor="start" letter-spacing="1.2">01 · SDLC</text>
